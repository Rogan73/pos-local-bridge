name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Android project
        run: flutter create . --platforms=android
      - name: Add Android permissions
        run: |
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          perms = [
              "android.permission.INTERNET",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
              "android.permission.WAKE_LOCK",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
          ]
          existing = {el.attrib.get(ns + "name") for el in root.findall("uses-permission")}
          for p in perms:
              if p not in existing:
                  el = ET.Element("uses-permission", {ns + "name": p})
                  root.insert(0, el)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          EOF
      - name: Configure release signing
        run: |
          python3 - << 'EOF'
          import os, subprocess
          # Генерируем чистый стандартный JKS, если его еще нет в репозитории
          if not os.path.exists("pos-bridge.jks"):
              subprocess.run([
                  "keytool", "-genkeypair", "-v",
                  "-keystore", "android/app/pos-bridge.jks",
                  "-storetype", "PKCS12",
                  "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
                  "-alias", "posbridge",
                  "-storepass", "rikoriko", "-keypass", "rikoriko",
                  "-dname", "CN=POSBridge, OU=Dev, O=RikoSoft, L=Valencia, S=Valencia, C=ES"
              ], check=True)
          else:
              import shutil
              shutil.copy("pos-bridge.jks", "android/app/pos-bridge.jks")

          kts = "android/app/build.gradle.kts"
          if os.path.exists(kts):
              s = open(kts).read()
              sc = (
                  'signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = "posbridge"\n'
                  '            keyPassword = "rikoriko"\n'
                  '            storeFile = file("pos-bridge.jks")\n'
                  '            storePassword = "rikoriko"\n'
                  '        }\n'
                  '    }\n'
                  '    buildTypes {'
              )
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36").replace("buildTypes {", sc, 1).replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
              open(kts, "w").write(s)
          EOF
      - name: Save keystore to repo (first run only)
        run: |
          if [ ! -f pos-bridge.jks ]; then
            cp android/app/pos-bridge.jks pos-bridge.jks
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add pos-bridge.jks
            git commit -m "Save persistent keystore" || true
            git push || true
          fi
      - name: Build signed APK
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/tcp-bridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tcp-bridge
          path: build/app/outputs/flutter-apk/tcp-bridge.apk
