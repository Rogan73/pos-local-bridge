name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Android project
        run: flutter create . --platforms=android
      - name: Add Android permissions
        run: |
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          perms = [
              "android.permission.INTERNET",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
              "android.permission.WAKE_LOCK",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
          ]
          existing = {el.attrib.get(ns + "name") for el in root.findall("uses-permission")}
          for p in perms:
              if p not in existing:
                  el = ET.Element("uses-permission", {ns + "name": p})
                  root.insert(0, el)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          EOF
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > raw.pfx
          openssl pkcs12 -in raw.pfx -passin pass:rikoriko -nodes -out temp.pem -legacy || openssl pkcs12 -in raw.pfx -passin pass:rikoriko -nodes -out temp.pem
          openssl pkcs12 -export -in temp.pem -out android/app/pos-bridge.jks -name "posbridge" -passout pass:rikoriko
          python3 - << 'EOF'
          import os
          kts = "android/app/build.gradle.kts"
          if os.path.exists(kts):
              s = open(kts).read()
              sc = (
                  'signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = "posbridge"\n'
                  '            keyPassword = "rikoriko"\n'
                  '            storeFile = file("pos-bridge.jks")\n'
                  '            storePassword = "rikoriko"\n'
                  '        }\n'
                  '    }\n'
                  '    buildTypes {'
              )
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36").replace("buildTypes {", sc, 1).replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
              open(kts, "w").write(s)
          EOF
      - name: Build signed APK
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/tcp-bridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tcp-bridge
          path: build/app/outputs/flutter-apk/tcp-bridge.apk
